name: Swift 6 Build
on: [push, pull_request]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: full build + all tests (includes SwiftAvroRpc compression codecs and SwiftAvroCluster)
          - os: macos-latest
            test-args: ""
          # Linux: full build + Core + Rpc tests only (Apple Compression and DistributedCluster unavailable)
          - os: ubuntu-latest
            test-args: "--filter SwiftAvroCoreTests --filter SwiftAvroRpcTests"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # macOS uses the system Xcode toolchain; setup-swift would pin an older
      # Swift whose compiler can't read the newer Xcode SDK (toolchain/SDK mismatch).
      - name: Setup Swift 6 (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: Build
        run: swift build -c release

      - name: Run Tests
        run: swift test ${{ matrix.test-args }}
